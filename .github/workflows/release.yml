name: release

# Build standalone binaries for macOS (arm64), Linux (x86_64) and Windows
# (x86_64) and attach
# them to the GitHub release when a v* tag is pushed.
# workflow_dispatch builds the same archives as workflow artifacts without
# publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload assets

# The jolt version is resolved at build time, so a release is built by the
# current compiler. The tests, the build and the smoke test all run before the
# publish step, so a compiler that can't build this tree fails the job and
# uploads nothing. Set the JOLT_PIN repository variable to a tag like v0.8.15
# to pin one during an incident, without a commit.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-macos
            shell: bash
          - os: ubuntu-latest
            target: x86_64-linux
            shell: bash
          # Windows has none of the native libraries, so the archive carries
          # MSYS2's, with the DLLs they load in turn
          - os: windows-latest
            target: x86_64-windows
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            curl unzip zip
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib

      - name: Resolve jolt version
        env:
          GH_TOKEN: ${{ github.token }}
          JOLT_PIN: ${{ vars.JOLT_PIN }}
        run: |
          if [ -n "$JOLT_PIN" ]; then
            ver="$JOLT_PIN"
            echo "jolt: pinned to $ver"
          else
            ver=$(gh api repos/jolt-lang/jolt/releases/latest --jq .tag_name)
            [ -n "$ver" ] && [ "$ver" != "null" ] || { echo "could not resolve latest jolt"; exit 1; }
            echo "jolt: latest release is $ver"
          fi
          echo "JOLT_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Install jolt
        run: ci/install-jolt.sh "${JOLT_VERSION}" "${{ matrix.target }}"

      # The runner's PATH has the AWS CLI's sqlite3.dll ahead of MSYS2's
      # libsqlite3-0.dll, and jolt-lang/db crashes on it. A DLL beside jolt.exe
      # is found first.
      - name: Use MSYS2's sqlite
        if: runner.os == 'Windows'
        run: cp /ucrt64/bin/libsqlite3-0.dll "$(dirname "$(command -v jolt)")/sqlite3.dll"

      - name: Test
        run: jolt -M:test

      - name: Build binary
        run: jolt build -m newsroom.core -o newsroom

      # Name from the ref: a tag's build carries its version, anything else
      # gets the bare name.
      - name: Package
        run: |
          case "${GITHUB_REF}" in
            refs/tags/*) name="newsroom-${GITHUB_REF_NAME}-${{ matrix.target }}" ;;
            *)           name="newsroom-${{ matrix.target }}" ;;
          esac
          mkdir -p "$name"
          exe=newsroom
          [ -f newsroom.exe ] && exe=newsroom.exe
          cp "$exe" README.md CHANGELOG.md "$name/"
          cp examples/config.edn "$name/config.example.edn"
          cp -r plugins "$name/plugins"
          # Windows looks beside the exe first, for a library and for the DLLs
          # it loads. sqlite goes in under the first name jolt-lang/db asks
          # for, so another program's sqlite3.dll on the PATH can't stand in.
          if [ "$RUNNER_OS" = Windows ]; then
            libs="libcrypto-3-x64.dll libssl-3-x64.dll zlib1.dll libsqlite3-0.dll"
            libs="$libs $(cd /ucrt64/bin && ls libxml2-*.dll)"
            for l in $libs; do
              cp "/ucrt64/bin/$l" "$name/"
              # grep finds nothing for a DLL that loads only system ones
              deps=$(ntldd -R "/ucrt64/bin/$l" | grep -ioE '[^ ]*ucrt64[\\/]bin[\\/][^ ]*\.dll' || true)
              for d in $deps; do cp "$(cygpath -u "$d")" "$name/"; done
            done
            mv "$name/libsqlite3-0.dll" "$name/sqlite3.dll"
            ls "$name"
          fi
          echo "PKG_DIR=$name" >> "$GITHUB_ENV"
          echo "PKG_EXE=$exe" >> "$GITHUB_ENV"

      # Run the packaged binary, so a native library or embedded resource the
      # build is missing fails here and not on a user's machine. The build's
      # own dependency checkouts are hidden while it runs: a binary still
      # finds a library's files there by the paths it was built from, which a
      # user's machine doesn't have, and v0.5.0 shipped needing one.
      # On Windows MSYS2 leaves the PATH too, so the archive has to carry
      # every DLL the binary loads.
      - name: Smoke test
        run: |
          homes="$HOME"
          if [ -n "${USERPROFILE:-}" ]; then homes="$homes $(cygpath -u "$USERPROFILE")"; fi
          hidden=""
          for h in $homes; do
            for d in "$h/.jolt/gitlibs" "$h/.m2"; do
              if [ -d "$d" ]; then mv "$d" "$d.hidden"; hidden="$hidden $d"; fi
            done
          done
          if [ "$RUNNER_OS" = Windows ]; then
            PATH=$(printf %s "$PATH" | tr : '\n' | grep -vi ucrt64 | paste -sd:)
          fi
          cd "$PKG_DIR"
          status=0
          ../ci/smoke.sh "./$PKG_EXE" || status=$?
          rm -f smoke.log
          for d in $hidden; do mv "$d.hidden" "$d"; done
          exit $status

      - name: Archive
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            zip -qr "${PKG_DIR}.zip" "$PKG_DIR"
            echo "PKG=${PKG_DIR}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${PKG_DIR}.tar.gz" "$PKG_DIR"
            echo "PKG=${PKG_DIR}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "newsroom ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes "Standalone binaries for macOS (arm64), Linux (x86_64) and Windows (x86_64).

          Unpack the archive and run \`newsroom\`, then open http://127.0.0.1:3000. The first run writes its config to \`~/.config/newsroom\`, and \`config.example.edn\` shows every option. The plugins in \`plugins/\` add sources newsroom doesn't read itself; copy a plugin's folder to \`~/.config/newsroom/plugins/\` to use it. The default model is DeepSeek, which reads \`DEEPSEEK_API_KEY\`.

          Runtime libraries: Linux needs sqlite3, libxml2 and OpenSSL 3, which most distributions have. macOS needs OpenSSL 3 (\`brew install openssl@3\`). The Windows archive carries its own, beside \`newsroom.exe\`.

          The macOS binary is unsigned, so clear the quarantine flag before the first run: \`xattr -d com.apple.quarantine ./newsroom\`." \
            || echo "release already exists, uploading asset"
          gh release upload "${GITHUB_REF_NAME}" "${PKG}" --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-${{ matrix.target }}
          path: ${{ env.PKG }}
