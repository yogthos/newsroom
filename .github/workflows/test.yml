name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            shell: bash
          - os: macos-latest
            target: aarch64-macos
            shell: bash
          # the jolt.exe archive carries no DLLs; MSYS2's UCRT64 has them all
          - os: windows-latest
            target: x86_64-windows
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    # jolt's git and Maven caches, where actions/cache can find them. jolt
    # reads HOME, which in an MSYS2 shell isn't the home actions/cache uses.
    env:
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.ci-deps/gitlibs
      JOLT_MAVEN_REPOSITORY: ${{ github.workspace }}/.ci-deps/m2
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            curl unzip
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib

      # sqlite3, libxml2 and OpenSSL are loaded at runtime; the POSIX runners have them.
      # Latest jolt by default; the JOLT_PIN repository variable pins one.
      - name: Resolve jolt version
        env:
          GH_TOKEN: ${{ github.token }}
          JOLT_PIN: ${{ vars.JOLT_PIN }}
        run: |
          if [ -n "$JOLT_PIN" ]; then
            ver="$JOLT_PIN"
            echo "jolt: pinned to $ver"
          else
            ver=$(gh api repos/jolt-lang/jolt/releases/latest --jq .tag_name)
            [ -n "$ver" ] && [ "$ver" != "null" ] || { echo "could not resolve latest jolt"; exit 1; }
            echo "jolt: latest release is $ver"
          fi
          echo "JOLT_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Install jolt
        run: ci/install-jolt.sh "${JOLT_VERSION}" "${{ matrix.target }}"

      # The runner's PATH has the AWS CLI's sqlite3.dll ahead of MSYS2's
      # libsqlite3-0.dll, and jolt-lang/db crashes on it. A DLL beside jolt.exe
      # is found first.
      - name: Use MSYS2's sqlite
        if: runner.os == 'Windows'
        run: cp /ucrt64/bin/libsqlite3-0.dll "$(dirname "$(command -v jolt)")/sqlite3.dll"

      # Maven Central sometimes answers a runner with 403, so the jars are
      # cached along with the git deps and only a deps.edn change fetches
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: .ci-deps
          key: deps-${{ matrix.target }}-${{ hashFiles('deps.edn') }}
          restore-keys: deps-${{ matrix.target }}-

      - name: Test
        run: jolt -M:test
