name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            shell: bash
          - os: macos-latest
            target: aarch64-macos
            shell: bash
          # the jolt.exe archive carries no DLLs; MSYS2's UCRT64 has them all
          - os: windows-latest
            target: x86_64-windows
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    # jolt's git and Maven caches, where actions/cache can find them. jolt
    # reads HOME, which in an MSYS2 shell isn't the home actions/cache uses.
    env:
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.ci-deps/gitlibs
      JOLT_MAVEN_REPOSITORY: ${{ github.workspace }}/.ci-deps/m2
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            curl unzip
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib

      # sqlite3, libxml2 and OpenSSL are loaded at runtime; the POSIX runners have them.
      # Latest jolt by default; the JOLT_PIN repository variable pins one.
      - name: Resolve jolt version
        env:
          GH_TOKEN: ${{ github.token }}
          JOLT_PIN: ${{ vars.JOLT_PIN }}
        run: |
          if [ -n "$JOLT_PIN" ]; then
            ver="$JOLT_PIN"
            echo "jolt: pinned to $ver"
          else
            ver=$(gh api repos/jolt-lang/jolt/releases/latest --jq .tag_name)
            [ -n "$ver" ] && [ "$ver" != "null" ] || { echo "could not resolve latest jolt"; exit 1; }
            echo "jolt: latest release is $ver"
          fi
          echo "JOLT_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Install jolt
        run: ci/install-jolt.sh "${JOLT_VERSION}" "${{ matrix.target }}"

      # The runner's PATH has the AWS CLI's sqlite3.dll ahead of MSYS2's
      # libsqlite3-0.dll, and jolt-lang/db crashes on it. A DLL beside jolt.exe
      # is found first.
      - name: Use MSYS2's sqlite
        if: runner.os == 'Windows'
        run: cp /ucrt64/bin/libsqlite3-0.dll "$(dirname "$(command -v jolt)")/sqlite3.dll"

      # Maven Central sometimes answers a runner with 403, so the jars are
      # cached along with the git deps and only a deps.edn change fetches
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: .ci-deps
          key: deps-${{ matrix.target }}-${{ hashFiles('deps.edn') }}
          restore-keys: deps-${{ matrix.target }}-

      # the speech engine: llama.cpp, the S3 decoder and LAME, linked into
      # the binary. Windows goes without it, and so without podcasts
      - name: Cache the speech engine's build
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            native/llama.cpp
            native/lame
            native/espeak-ng
            native/onnxruntime
          key: tts-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('deps.edn', 'native/build_tts.sh') }}

      # the Vulkan SDK, for the speech engine's GPU plugin: the shader
      # compiler and the headers. The SDK has no loader to link against, so
      # that is the distribution's; at runtime the plugin needs only the
      # loader a GPU's driver installs
      - name: Install the Vulkan SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libvulkan-dev
          v=1.4.357.1
          curl -sSfL -o "$RUNNER_TEMP/vulkan.tar.xz" "https://sdk.lunarg.com/sdk/download/$v/linux/vulkansdk-linux-x86_64-$v.tar.xz"
          mkdir -p "$RUNNER_TEMP/vulkan"
          tar -xJf "$RUNNER_TEMP/vulkan.tar.xz" -C "$RUNNER_TEMP/vulkan"
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan/$v/x86_64" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vulkan/$v/x86_64/bin" >> "$GITHUB_PATH"

      # Metal on macOS; on Linux the CPU, with a Vulkan plugin beside it for
      # the GPUs whose drivers are there
      - name: Build the speech engine
        if: runner.os != 'Windows'
        env:
          NEWSROOM_TTS_GPU: ${{ runner.os == 'Linux' && 'vulkan' || '' }}
        run: jolt tts

      - name: Test
        run: jolt -M:test
